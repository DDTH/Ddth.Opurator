# Automatically release a new version when a PR is merged to branch `release`

name: 'release'

on:
  pull_request:
    types: [ closed ]
    branches: [ release ]

permissions:
  contents: read

env:
  BRANCH_TO_RELEASE: 'release'
  TAG_PREFIX: 'v'
  FILE_CHANGELOG: 'RELEASE-NOTES.md'
  DOTNET_VERSION: '6.x'
  NUGET_PROJECT_FILE: 'Ddth.Opurator/Ddth.Opurator.csproj'

jobs:
  CallCI:
    uses: ./.github/workflows/ci.yaml

  ReleaseDryRun:
    runs-on: ubuntu-latest
    needs: [ CallCI ]
    if: |
      github.event.pull_request.merged == true
    outputs:
      RESULT: ${{ steps.release_dry_run.outputs.result }}
      VERSION: ${{ steps.release_dry_run.outputs.releaseVersion }}
      RELEASE_NOTES: ${{ steps.release_dry_run.outputs.releaseNotes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Release (dry-run)
        id: release_dry_run
        uses: btnguyen2k/action-semrelease@v4
        with:
          dry-run: true
          auto-mode: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag-major-release: false
          tag-minor-release: false
          branches: ${{ env.BRANCH_TO_RELEASE }}
          tag-prefix: ${{ env.TAG_PREFIX }}
          tag-only: true

  Release:
    runs-on: ubuntu-latest
    if: |
      (github.event.pull_request.merged == true) && (needs.ReleaseDryRun.outputs.RESULT == 'SUCCESS')
    needs: [ ReleaseDryRun ]
    permissions:
      contents: write # to be able to publish a GitHub release
      id-token: write # GitHub OIDC permission
    outputs:
      RESULT: ${{ needs.ReleaseDryRun.outputs.RESULT }}
      VERSION: ${{ needs.ReleaseDryRun.outputs.VERSION }}
      RELEASE_NOTES: ${{ needs.ReleaseDryRun.outputs.RELEASE_NOTES }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: NuGet login (OIDC → temp API key)
        # New NuGet Trusted Publishing workflow (ref https://learn.microsoft.com/en-us/nuget/nuget-org/trusted-publishing#github-actions-setup)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Prepare NuGet metadata
        uses: actions/github-script@v9
        env:
          VERSION: ${{ needs.ReleaseDryRun.outputs.VERSION }}
          RELEASE_NOTES: ${{ needs.ReleaseDryRun.outputs.RELEASE_NOTES }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const version = process.env.VERSION ?? '';
            const releaseNotes = process.env.RELEASE_NOTES ?? '';
            const runnerTemp = process.env.RUNNER_TEMP;

            const packageVersionPattern =
              /^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;

            if (version.length > 128 || !packageVersionPattern.test(version)) {
              throw new Error(
                'Release version is not a valid SemVer-shaped package version.'
              );
            }

            if (!runnerTemp) {
              throw new Error('RUNNER_TEMP is not available.');
            }

            const invalidXml10Character =
              /[^\u0009\u000A\u000D\u0020-\uD7FF\uE000-\uFFFD\u{10000}-\u{10FFFF}]/u;

            if (invalidXml10Character.test(releaseNotes)) {
              throw new Error(
                'Release notes contain characters that are invalid in XML 1.0.'
              );
            }

            const maximumReleaseNotesSize = 8 * 1024;
            const releaseNotesSize = Buffer.byteLength(releaseNotes, 'utf8');

            if (releaseNotesSize > maximumReleaseNotesSize) {
              throw new Error(
                `Release notes exceed ${maximumReleaseNotesSize} UTF-8 bytes.`
              );
            }

            const releaseNotesFile = path.join(
              runnerTemp,
              'release-notes.txt'
            );

            fs.writeFileSync(releaseNotesFile, releaseNotes, {
              encoding: 'utf8',
              flag: 'w',
              mode: 0o600
            });

            console.log('NuGet metadata prepared.');
            console.log(`Release version: ${version}`);
            console.log(`Release notes size: ${releaseNotesSize} UTF-8 bytes`);
      - name: Publish NuGet package
        env:
          VERSION: ${{ needs.ReleaseDryRun.outputs.VERSION }}
          RELEASE_NOTES: ${{ needs.ReleaseDryRun.outputs.RELEASE_NOTES }}
        run: |
          echo "🕘 Updating ${FILE_CHANGELOG} and other metadata..."

          echo ========== update ${FILE_CHANGELOG} files ==========
          DATE=`date +%Y-%m-%d`
          head -1 ${FILE_CHANGELOG} > .temp.md
          {
            printf '\n## %s - v%s\n\n' "${DATE}" "${VERSION}"
            printf '%s\n' "${RELEASE_NOTES}"
          } >> .temp.md
          tail -n +2 ${FILE_CHANGELOG} >> .temp.md
          mv -f .temp.md ${FILE_CHANGELOG}

          echo ========== update .md files ==========
          sed -i -E "s/<<VERSION>>/v${VERSION}/" ./*.md

          echo ========== Build and Publish NuGet package ==========
          dotnet pack "${NUGET_PROJECT_FILE}" \
            --configuration Release \
            --output ./ \
            -p:PackageVersion="${VERSION}" \
            -p:PackageReleaseNotesFile="${RUNNER_TEMP}/release-notes.txt"
          dotnet nuget push *.nupkg --source "nuget.org" --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }}

          echo ========== commit updates ==========
          git config --global user.email "<>"
          git config --global user.name "CI Build"
          git commit -am "Update metadata for new version ${VERSION}"
          git push origin ${BRANCH_TO_RELEASE}

          echo ========== tag ==========
          git tag -f -a "${TAG_PREFIX}${VERSION}" -m "Release ${TAG_PREFIX}/v${VERSION}"
          git push origin "${TAG_PREFIX}${VERSION}" -f
          echo "✅ Done."
      - name: Create release
        uses: actions/github-script@v9
        env:
          VERSION: ${{ needs.ReleaseDryRun.outputs.VERSION }}
          RELEASE_NOTES: ${{ needs.ReleaseDryRun.outputs.RELEASE_NOTES }}
        with:
          script: |
            const {data: release} = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env['TAG_PREFIX'] + process.env['VERSION'],
              name: process.env['TAG_PREFIX'] + process.env['VERSION'],
              body: process.env['RELEASE_NOTES'],
              draft: false,
              prerelease: false,
            });
            console.log('✅ Created release: ', release);
      - name: Cleanup file .semrelease/this_release
        run: |
          VERSION='${{ needs.ReleaseDryRun.outputs.VERSION }}'
          echo "🕘 Cleaning up file .semrelease/this_release..."
          echo "# This file has been cleaned up post-releasing version ${VERSION}." > .semrelease/this_release
          echo "# Generate its content quickly using the following command:" >> .semrelease/this_release
          echo "#   git log origin..HEAD | grep \"^\s\" > .semrelease/this_release" >> .semrelease/this_release
          git config --global user.email "<>"
          git config --global user.name "CI Build"
          git commit -am "Cleanup file .semrelease/this_release post-releasing version ${VERSION}"
          git push -f
          echo "✅ Done."

  MergeToMain:
    runs-on: ubuntu-latest
    needs: [ Release ]
    permissions:
      pull-requests: write # to be able to create PRs or comment on released PRs
    steps:
      - uses: actions/github-script@v9
        env:
          VERSION: ${{ needs.Release.outputs.VERSION }}
          RELEASE_NOTES: ${{ needs.Release.outputs.RELEASE_NOTES }}
        with:
          script: |
            const {data: pr} = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Merge to main after releasing new version ${process['env']['VERSION']}`,
              body: process['env']['RELEASE_NOTES'],
              head: process['env']['BRANCH_TO_RELEASE'],
              base: 'main',
              maintainer_can_modify: true,
            });
            console.log('✅ Created PR: ', pr);
